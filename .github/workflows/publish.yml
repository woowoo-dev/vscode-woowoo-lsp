# Builds the extension and publishes it to the VS Code Marketplace and Open VSX.
#
# Release: create a GitHub release whose tag is "v" + the version in package.json (e.g. v1.3.0).
# The VSIX is built and attached to the release; publishing waits for an approval in the
# `marketplace` environment.
#
# Dry run: start the workflow manually (Actions -> Publish -> Run workflow); it only builds the
# VSIX and keeps it as a workflow artifact.
#
# Both registries accept this workflow through Trusted Publishing (OIDC), registered for the
# repository woowoo-dev/vscode-woowoo-lsp, workflow publish.yml and environment marketplace:
# a Trusted Publishing policy of the Marketplace publisher michal-janecek and a Trusted Publisher
# of the Open VSX namespace michal-janecek. No token is stored in the repository.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check that the tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # the same command as _install_bundle in noxfile.py, from the pinned requirements.txt
      - name: Bundle Python libraries
        run: python -m pip install -t ./bundled/libs --no-cache-dir --implementation py --no-deps --require-hashes -r ./requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npm run vsce-package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: woowoo-vscode.vsix

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # attach the VSIX to the release
      id-token: write # Marketplace Trusted Publishing
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      # first, so that the VSIX can still be uploaded by hand if publishing fails
      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" woowoo-vscode.vsix --repo "$GITHUB_REPOSITORY"

      # --oidc (Trusted Publishing) needs vsce 4.1.0 or newer
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath woowoo-vscode.vsix

      # an OVSX_PAT token would take precedence over Trusted Publishing, so none is set
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish woowoo-vscode.vsix --trusted-publishing
