# Runs on every PR and on main: lints and builds the VSIX, and runs the language server smoke
# test (bundled/tool/woowoo_pygls/tests/smoke_test.py) against the bundled server, i.e. with the
# libraries the VSIX ships in bundled/libs, on every supported Python version.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vsix:
    name: Lint and build VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Bundle Python libraries
        run: python -m pip install -t ./bundled/libs --no-cache-dir --implementation py --no-deps --require-hashes -r ./requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm run vsce-package

      # lets a reviewer install the PR build: Extensions -> ... -> Install from VSIX
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: woowoo-vscode.vsix

  server:
    name: Bundled server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Bundle Python libraries
        run: python -m pip install -t ./bundled/libs --no-cache-dir --implementation py --no-deps --require-hashes -r ./requirements.txt

      # users install wuff themselves, so it comes from PyPI
      - run: python -m pip install wuff

      - name: Smoke test
        run: python bundled/tool/woowoo_pygls/tests/smoke_test.py python "$PWD/bundled/tool/lsp_server.py"
