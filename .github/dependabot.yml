version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'no-changelog'

  - package-ecosystem: 'pip'
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'debt'
    commit-message:
      include: 'scope'
      prefix: 'pip'
    ignore:
      - dependency-name: 'pygls'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'no-changelog'
    ignore:
      # ESLint 9+ drops .eslintrc.json; moving to eslint.config.js is a separate change
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'
